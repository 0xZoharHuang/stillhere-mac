name: Windows desktop acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-2022
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Build candidate
        shell: cmd
        run: windows\build.cmd
      - name: Exercise capture, native input, and shortcut exit
        shell: pwsh
        run: |
          $reports = Join-Path $PWD 'dist/desktop-reports'
          New-Item -ItemType Directory -Force $reports | Out-Null
          $exe = Join-Path $PWD 'dist/windows/StillHere.exe'
          @{
            Commit = $env:GITHUB_SHA
            OS = [Environment]::OSVersion.VersionString
            ProcessSession = [Diagnostics.Process]::GetCurrentProcess().SessionId
            ExeSHA256 = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          } | ConvertTo-Json | Set-Content (Join-Path $reports 'environment.json')
          function Run-Check($mode, $filename) {
            $output = Join-Path $reports $filename
            $process = Start-Process $exe -ArgumentList $mode,'--output',$output -PassThru
            if (!$process.WaitForExit(65000)) {
              Stop-Process -Id $process.Id
              throw "Owned $mode diagnostic exceeded its timeout."
            }
            if (Test-Path $output) { Get-Content $output }
            if ($process.ExitCode -ne 0) { throw "$mode failed with exit code $($process.ExitCode)." }
          }
          Run-Check '--core-self-test' 'core.json'
          Run-Check '--diagnose' 'capture.json'
          Run-Check '--qa-run-ui' 'native-input.json'
      - name: Package the exact tested executable
        shell: pwsh
        run: |
          Compress-Archive -LiteralPath dist/windows/StillHere.exe -DestinationPath dist/StillHere-0.2.0-windows.zip
          py -3 scripts/package-windows.py dist/windows/StillHere.exe dist/StillHere-0.2.0-windows-ready.zip
          if ($LASTEXITCODE -ne 0) { throw 'Ready package creation or verification failed' }
          Expand-Archive -LiteralPath dist/StillHere-0.2.0-windows-ready.zip -DestinationPath dist/ready-check
          if ((Get-FileHash dist/ready-check/StillHere.exe).Hash -ne (Get-FileHash dist/windows/StillHere.exe).Hash) { throw 'Ready package executable differs from tested build' }
          $hash = (Get-FileHash dist/StillHere-0.2.0-windows.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  StillHere-0.2.0-windows.zip" | Set-Content -Encoding ascii dist/SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: StillHere-windows-desktop
          path: |
            dist/desktop-reports/*.json
            dist/StillHere-0.2.0-windows.zip
            dist/StillHere-0.2.0-windows-ready.zip
            dist/SHA256SUMS-windows.txt
